<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Chat - GharTek</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#a04100",
                "primary-container": "#ff6b00",
                "primary-fixed-dim": "#ffb693",
                "surface-container": "#eeeeee",
                "surface-container-low": "#f3f3f3",
                "surface-container-lowest": "#ffffff",
                "surface-container-highest": "#e2e2e2",
                "outline-variant": "#e2bfb0",
                secondary: "#5f5e5e"
              }
            }
          }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fcfaf8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: max(884px, 100dvh);
            display: flex;
            justify-content: center;
        }
        /* Typing indicator animation */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #a04100;
            color: #a04100;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: "";
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #a04100;
            color: #a04100;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 10px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #a04100;
            color: #a04100;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #a04100; }
            50%, 100% { background-color: rgba(160, 65, 0, 0.2); }
        }
        /* Slide in animation for messages */
        .msg-enter {
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Smooth scrolling */
        #chat-window { scroll-behavior: smooth; }
        
        /* Glassmorphism input bar */
        .glass-input {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(226, 191, 176, 0.4);
        }
    </style>
</head>
<body>

<div class="relative flex h-full min-h-screen w-full max-w-md flex-col bg-[#efe9e4] shadow-2xl overflow-hidden">
    
    <!-- WhatsApp-like Header -->
    <div class="flex items-center bg-white px-3 py-3 shadow-[0_2px_10px_rgba(0,0,0,0.05)] z-20 shrink-0">
        <button onclick="window.location.href='code.html'" class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-[#1d130c]">
            <span class="material-symbols-outlined text-[24px]">arrow_back</span>
        </button>
        
        <div class="flex items-center gap-3 ml-2 flex-1 cursor-pointer">
            <div class="relative">
                <div class="h-10 w-10 rounded-full bg-cover bg-center shadow-sm" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD9YL9DGrEJf-1nj4ag4O2_mKflxihEj4xTpam6YoTN3a1U7SxFc1IyXGWEhxbGkbnI8dBR4CzlsTqBkxHfmVIGs-86cZk1YEG97XQ8XGO2ANWMoSwNFMkqSN1o_DlaxzYbhafCQUf1gwR4lsv80QNT0uAgEhbYcuojwIk0sSqyZahpW4CA53tixRd99kveTz3kU9tigjCmWiyohhBbORH9MwYa1M34hAIK0-ny5DoQu9MpdIbEbKso6QiN2G7yXxEfjZ3YYeRaBR8');"></div>
            </div>
            <div class="flex flex-col">
                <p class="text-[16px] font-bold text-[#1d130c] leading-tight">GharTek Support</p>
                <p class="text-xs font-semibold text-green-600 mt-0.5 tracking-wide">Online</p>
            </div>
        </div>
        
        <div class="flex items-center gap-1">
            <button class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-primary">
                <span class="material-symbols-outlined text-[22px]">call</span>
            </button>
            <button class="flex h-10 w-10 items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-95 text-primary">
                <span class="material-symbols-outlined text-[22px]">more_vert</span>
            </button>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-window" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 relative pb-[80px]">
        <!-- Date Badge -->
        <div class="flex justify-center mb-2">
            <span class="bg-white/70 text-secondary text-xs font-semibold py-1 px-3 rounded-full shadow-sm backdrop-blur-md">Today</span>
        </div>
        
        <!-- Start Conversation Button Container -->
        <div id="start-btn-container" class="absolute inset-0 flex items-center justify-center bg-white/40 backdrop-blur-[2px] z-10 transition-opacity duration-300">
            <button id="start-conv-btn" class="flex items-center gap-2 bg-gradient-to-r from-primary-container to-primary text-white px-6 py-3 rounded-full shadow-lg font-bold hover:shadow-xl transition-all active:scale-95">
                <span class="material-symbols-outlined">chat</span>
                Start Conversation
            </button>
        </div>

        <!-- Chat messages will be dynamically added here -->
    </div>

    <!-- Message Input Bar (Hidden initially) -->
    <div id="input-bar" class="absolute bottom-0 left-0 right-0 p-3 glass-input flex items-end gap-2 transform translate-y-full transition-transform duration-300">
        <button class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-secondary hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined text-[24px]">add_circle</span>
        </button>
        
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-outline-variant/30 flex items-center min-h-[44px] overflow-hidden">
            <textarea id="msg-input" rows="1" placeholder="Message..." class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 px-4 text-[15px] max-h-32 placeholder-secondary text-[#1d130c] focus:outline-none"></textarea>
            <button class="flex h-11 w-11 shrink-0 items-center justify-center text-secondary hover:text-primary transition-colors mr-1">
                <span class="material-symbols-outlined text-[22px]">mood</span>
            </button>
        </div>
        
        <button id="send-btn" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-primary text-white shadow-md hover:bg-primary-container transition-colors active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">send</span>
        </button>
    </div>

</div>

<script>
    const startBtnContainer = document.getElementById('start-btn-container');
    const startConvBtn = document.getElementById('start-conv-btn');
    const chatWindow = document.getElementById('chat-window');
    const inputBar = document.getElementById('input-bar');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    
    // Auto-resize textarea
    msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    function scrollToBottom() {
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function createMessageBubble(text, isUser = false) {
        const div = document.createElement('div');
        div.className = `flex w-full msg-enter ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const bubbleColor = isUser ? 'bg-primary text-white rounded-br-sm' : 'bg-white text-[#1d130c] rounded-bl-sm border border-surface-container-highest shadow-sm';
        const timeColor = isUser ? 'text-primary-fixed-dim' : 'text-secondary';
        
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        div.innerHTML = `
            <div class="max-w-[75%] rounded-2xl px-4 py-2.5 flex flex-col gap-1 ${bubbleColor}">
                <p class="text-[15px] leading-relaxed break-words">${text}</p>
                <div class="flex justify-end items-center gap-1">
                    <span class="text-[10px] font-medium ${timeColor}">${timeString}</span>
                    ${isUser ? `<span class="material-symbols-outlined text-[14px] text-white" style="font-variation-settings: 'FILL' 1;">done_all</span>` : ''}
                </div>
            </div>
        `;
        return div;
    }

    function createTypingIndicator(isUser = false, id = 'typing-indicator') {
        const div = document.createElement('div');
        div.id = id;
        div.className = `flex w-full msg-enter ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const bubbleColor = isUser ? 'bg-primary rounded-br-sm' : 'bg-white rounded-bl-sm border border-surface-container-highest shadow-sm';
        
        div.innerHTML = `
            <div class="max-w-[75%] rounded-2xl px-5 py-4 ${bubbleColor}">
                <div class="dot-flashing ${isUser ? '!bg-white before:!bg-white after:!bg-white' : ''}"></div>
            </div>
        `;
        return div;
    }

    startConvBtn.addEventListener('click', () => {
        // Hide start button
        startBtnContainer.style.opacity = '0';
        setTimeout(() => {
            startBtnContainer.remove();
            
            // Show input bar
            inputBar.classList.remove('translate-y-full');
            
            // Show typing indicator from support
            const typingInd = createTypingIndicator(false, 'support-typing');
            chatWindow.appendChild(typingInd);
            scrollToBottom();
            
            // After 1.5 seconds, send the auto message
            setTimeout(() => {
                document.getElementById('support-typing').remove();
                chatWindow.appendChild(createMessageBubble("How May i Help You?", false));
                scrollToBottom();
            }, 1500);

        }, 300);
    });

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    function sendMessage() {
        const text = msgInput.value.trim();
        if(!text) return;

        // Reset input
        msgInput.value = '';
        msgInput.style.height = 'auto';

        // Append user message
        chatWindow.appendChild(createMessageBubble(text, true));
        scrollToBottom();

        // Simulate support typing back
        setTimeout(() => {
            const typingInd = createTypingIndicator(false, 'support-typing-reply');
            chatWindow.appendChild(typingInd);
            scrollToBottom();
            
            // Simulate reply
            setTimeout(() => {
                const rep = document.getElementById('support-typing-reply');
                if(rep) rep.remove();
                chatWindow.appendChild(createMessageBubble("Please wait while I check your order details...", false));
                scrollToBottom();
            }, 2000);
            
        }, 600);
    }
</script>

</body>
</html>
